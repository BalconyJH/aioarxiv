[project]
name = "aioarxiv"
version = "0.2.2"
description = "Asynchronous arXiv API client with rate limiting and paper downloads"
authors = [
    { name = "BalconyJH", email = "balconyjh@gmail.com" },
]
dependencies = [
    "loguru~=0.7",
    "pydantic>=2.9.2",
    "aiohttp>=3.10.10",
    "tenacity>=9.0.0",
    "aiofiles>=24.1.0",
    "platformdirs>=4.3.6",
    "tzdata>=2024.2",
    "pydantic-settings>=2.7.1",
    "defusedxml>=0.7.1",
    "certifi>=2025.10.5",
    "aiolimiter>=1.2.1",
    "typing-extensions>=4.15.0",
]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["arxiv", "asyncio", "aiohttp", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/BalconyJH/aioarxiv"
Repository = "https://github.com/BalconyJH/aioarxiv"
"Bug Tracker" = "https://github.com/BalconyJH/aioarxiv/issues"

[dependency-groups]
test = [
    "pytest-cov~=7.0",
    "pytest-xdist~=3.6",
    "pytest-asyncio~=1.4",
    "pytest-mock>=3.14.0",
    "pytest>=9.1.1",
]
dev = [
    "ruff>=0.15",
    "basedpyright>=1.39.9",
    "ty>=0.0.63",
]
docs = [
    "mike",
    "mkdocstrings-python>=2.0.5",
    "zensical>=0.0.51",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=aioarxiv --cov-report=term-missing --ignore=.venv/"
asyncio_default_fixture_loop_scope = "session"

[tool.coverage.run]
omit = [
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # PEP8-naming
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "FA",    # flake8-future-annotations
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLOT",  # flake8-slots
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TC",    # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "PD",    # pandas-vet
    "PGH",   # pygrep-hooks
    "PL",    # pylint
    "TRY",   # tryceratops
    "FLY",   # flynt
    "FAST",  # FastAPI
    "PERF",  # Perflint
    "FURB",  # refurb
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",   # Ruff format handles long lines; the remaining cases are strings.
    "UP035",  # pyupgrade conflicts with the required typing.Callable import.
    "TRY003",
    "TRY301",  # Raising inline is clearer than adding a single-use inner function.
    "BLE001",  # except Exception as e
    "PGH003",  # Type checker ignore syntax is not standardized.
    "PLC0414",  # Import aliases explicitly mark re-exports.
    "N818",  # Public exception names do not all use an Error suffix.
    "RET502", # return = return None
    "RET503",  # Implicit None returns are intentional.
    "PLC0105",  # R and Q already identify covariant and contravariant variables.
    "PLR0913",  # Argument counts are part of the public API design.
    "PLR0917",  # Positional argument counts are part of the public API design.
    "SIM108",  # Explicit branches remain clearer in the affected cases.
    "RUF009",  # Avoid introducing extra module-level variables.
    "RUF003",  # Allow intentional Unicode punctuation in comments.
    "SLOT000", # Dynamic attributes are required, mainly by the json5 backend.
    "PLR0911", "PLR0912", "PLR0915",  # Existing control flow is intentionally explicit.
    "PYI041", # int and float have disjoint runtime types.
    "PLW2901",  # Reassigning shallow iteration variables is intentional.
    "S101", # Assertions are appropriate for internal invariants and tests.
    "PLR2004",  # Numeric constants are sufficiently local and descriptive.
    "TRY004",  # Exception types are selected deliberately at each call site.
    "COM812", # Ruff format owns trailing comma style.
    "TID252", # Relative imports are permitted within the package.
    "ISC001", # format warning
]
flake8-quotes = { inline-quotes = "double", multiline-quotes = "double" }

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.isort]
length-sort = false
force-sort-within-sections = true
known-first-party = ["aioarxiv", "tests"]
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.basedpyright]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "standard"
include = ["aioarxiv", "tests"]
executionEnvironments = [
    { root = "./tests", extraPaths = [
        "./",
    ] },
    { root = "./" },
]
exclude = [
    "**/__pycache__",
    ".venv/**",
]
disableBytesTypePromotions = true

[tool.ty.rules]
deprecated = "ignore"

[tool.uv.sources]
mike = { git = "https://github.com/squidfunk/mike.git", rev = "2d4ad799442f4592db8ad53b179bfb33db8c69ac" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
