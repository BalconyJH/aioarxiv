name: Bug report
title: "Bug: "
description: Report a problem to help us improve aioarxiv
labels: ["bug"]
body:
  - type: dropdown
    id: env-os
    attributes:
      label: Operating system
      description: Select the operating system running aioarxiv
      options:
        - Windows
        - MacOS
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: env-python-ver
    attributes:
      label: Python version
      description: Enter the Python version running aioarxiv
      placeholder: e.g. 3.11.0
    validations:
      required: true

  - type: input
    id: env-nb-ver
    attributes:
      label: aioarxiv version
      description: Enter the installed aioarxiv version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: textarea
    id: describe
    attributes:
      label: Problem description
      description: Describe the problem clearly and concisely
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide detailed steps that reproduce the problem
      placeholder: |
        1. First...
        2. Then...
        3. The following happened...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Provide any logs or screenshots that may help diagnose the problem
